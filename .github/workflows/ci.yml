name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
      - 'package.json'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - name: Require front matter
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file")"
            if [[ "$first_line" != "---" ]]; then
              echo "::error file=$file::Markdown content must begin with YAML front matter"
              exit 1
            fi
          done < <(find content -type f -name '*.md' -print0)
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.13.0 'content/**/*.md'

  build:
    name: Hugo production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - name: Build with pinned Hugo container
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/gohugoio/hugo:v0.164.0@sha256:630fef353bd10c5a23f909002d18dcdc031682375632a38d4fcfd20ad1e5441f \
            --minify --gc
      - uses: actions/upload-artifact@6f51b1e991c59a1f4c10e149a01efc2558dd9ce4
        with:
          name: site-preview
          path: public/
          retention-days: 5
          if-no-files-found: error

  links:
    name: Internal link integrity
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: site-preview
          path: public/
      - name: Check generated links
        run: docker run --rm -v "$PWD/public:/input" lycheeverse/lychee:latest --offline --no-progress '/input/**/*.html'
