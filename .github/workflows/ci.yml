name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
      - 'package.json'
      - '.markdownlint-cli2.jsonc'
      - '.pa11yci.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938

      - name: Require front matter
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file")"
            if [[ "$first_line" != "---" ]]; then
              echo "::error file=$file::Markdown content must begin with YAML front matter"
              exit 1
            fi
          done < <(find content -type f -name '*.md' -print0)

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.13.0 'content/**/*.md'

      - name: Build with pinned Hugo container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache -v "$PWD:/src" -w /src \
            ghcr.io/gohugoio/hugo:v0.164.0@sha256:630fef353bd10c5a23f909002d18dcdc031682375632a38d4fcfd20ad1e5441f \
            --minify --gc --baseURL "/"

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/services/index.html
          test -s public/about/index.html
          test -s public/contact/index.html
          grep -q 'Edwin Jonathan' public/index.html
          grep -q 'Edwin Cloud DevOps Services' public/services/index.html

      - name: Check generated links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir public 'public/**/*.html'
          failIfEmpty: true

      - name: Validate generated HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/htmltest.tar.gz \
            https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz
          tar -xzf /tmp/htmltest.tar.gz -C /tmp htmltest
          /tmp/htmltest -s public

      - name: Accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public >/tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx --yes pa11y-ci@3.1.0 --config .pa11yci.json
