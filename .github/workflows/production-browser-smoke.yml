name: Live production browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production_browser_smoke.cjs'
      - '.github/workflows/production-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed site interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live pages and interactions
        run: node scripts/production_browser_smoke.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-production-browser-smoke
          path: production-browser-smoke/
          if-no-files-found: warn
