name: Live production browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production_browser_smoke.cjs'
      - '.github/workflows/production-browser-smoke.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed site interactions
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live pages and interactions
        run: node scripts/production_browser_smoke.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-production-browser-smoke
          path: production-browser-smoke/
          if-no-files-found: warn
