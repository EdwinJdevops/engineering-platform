name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
      - '.github/workflows/production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - uses: peaceiris/actions-hugo@16a02c1c8e2e11788151b549a7422e01da6f2866
        with:
          hugo-version: '0.134.3'
          extended: true
      - uses: actions/configure-pages@983d7736951b742f1d1e56cae1ebf4aebfbbebef
        id: pages
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public

  deploy:
    name: Deploy and verify
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164830723ce3dd474eeee5a44ea8466117
      - name: Verify production
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$SITE_URL" || true)"
            if [[ "$code" == "200" ]]; then
              echo "Production verification passed: HTTP 200"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 10
          done
          echo "::error::Production endpoint did not return HTTP 200"
          exit 1
