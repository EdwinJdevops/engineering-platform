name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
      - '.github/workflows/production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache -v "$PWD:/src" -w /src \
            ghcr.io/gohugoio/hugo:v0.164.0@sha256:630fef353bd10c5a23f909002d18dcdc031682375632a38d4fcfd20ad1e5441f \
            --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

  deploy:
    name: Deploy and verify
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify production
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          routes=("" "portfolio/" "projects/" "articles/" "services/" "engineering/" "engineering/delivery-record/" "contact/"
            "projects/warden/" "projects/infraguard/" "projects/infraguard-agent/"
            "projects/consequential-execution-runtime/"
            "articles/building-production-ai-observability-on-kubernetes-opentelemetry-langfuse-prometheus-grafana-from-zero-to-scale/")
          for route in "${routes[@]}"; do
            passed=false
            for attempt in 1 2 3 4 5; do
              code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "${base}${route}" || true)"
              if [[ "$code" == "200" ]]; then
                passed=true
                break
              fi
              echo "Attempt $attempt: ${route:-/} returned HTTP $code"
              sleep 10
            done
            if [[ "$passed" != true ]]; then
              echo "::error::Production route ${route:-/} did not return HTTP 200"
              exit 1
            fi
            echo "Verified HTTP 200: ${route:-/}"
          done
          echo "Production route smoke checks passed"
          # Recruiter credential reference must be present in the published About HTML.
          # This checks the local link, not issuer authentication or external service availability.
          curl --fail --location --silent --show-error --max-time 20 "${base}portfolio/" -o /tmp/production-portfolio.html
          if ! grep -Fq 'https://learn.microsoft.com/en-us/users/jonathanedwin-0146/credentials/certification/azure-fundamentals' /tmp/production-portfolio.html; then
            echo "::error::Published About page missing exact owner-provided Microsoft credential link"
            exit 1
          fi
          if ! grep -Fq 'Cloud DevOps Engineering Programme' /tmp/production-portfolio.html; then
            echo "::error::Published About page missing ALX training reference"
            exit 1
          fi
          echo "Published credential link and ALX training reference verified in About HTML"
          # A successful HTML response alone does not establish that the portrait and assets shipped.
          for asset in "images/edwin-portrait-web.webp" "css/main.css" \
            "js/infrastructure-scene.js" "js/infrastructure-webgl.js" \
            "js/scroll-reveal.js" "js/editorial-covers.js" \
            "images/projects/warden.svg" "images/projects/infraguard.svg" \
            "images/projects/infraguard-agent.svg" "images/projects/driftguard.svg" \
            "images/projects/optimization-evidence.svg" "images/projects/cer.svg" \
            "images/projects/sentinel.svg" "images/projects/archnet.svg"; do
            url="${base}${asset}"
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$url")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Production asset $asset returned HTTP $code"
              exit 1
            fi
            echo "Verified HTTP 200: $asset"
          done
          # Verify the Google Search Console ownership token at the exact published URL.
          # Google requires HTTP 200 without a redirect and the unmodified file body.
          verification="google19c4bfed3c4a8a5b.html"
          expected="google-site-verification: $verification"
          verified=false
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --max-time 15 --output /tmp/gsc-verification.html --write-out '%{http_code}' "${base}${verification}" || true)"
            if [[ "$code" == "200" ]] && cmp -s /tmp/gsc-verification.html <(printf '%s' "$expected"); then
              verified=true
              break
            fi
            echo "Verification file attempt $attempt returned HTTP ${code:-unavailable} or mismatched content"
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Google ownership file is not served at the required URL"
            exit 1
          fi
          echo "Google ownership file verified: HTTP 200, no redirect, exact bytes"
          # Verify the portrait is nonempty and WebP, rather than a missing-page response.
          curl --fail --location --silent --show-error --max-time 20 "${base}images/edwin-portrait-web.webp" -o /tmp/production-portrait.webp
          bytes="$(wc -c < /tmp/production-portrait.webp)"
          riff="$(od -An -tx1 -N4 /tmp/production-portrait.webp | tr -d ' \n')"
          webp="$(od -An -tx1 -j8 -N4 /tmp/production-portrait.webp | tr -d ' \n')"
          if [[ "$bytes" -lt 10000 || "$riff" != "52494646" || "$webp" != "57454250" ]]; then
            echo "::error::Production portrait failed RIFF/WEBP container signature check"
            exit 1
          fi
          echo "Production portrait RIFF/WEBP signature verified ($bytes bytes); browser checks validate image decoding"
