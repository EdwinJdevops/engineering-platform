name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
      - '.github/workflows/production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache -v "$PWD:/src" -w /src \
            ghcr.io/gohugoio/hugo:v0.164.0@sha256:630fef353bd10c5a23f909002d18dcdc031682375632a38d4fcfd20ad1e5441f \
            --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

  deploy:
    name: Deploy and verify
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify production
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$SITE_URL" || true)"
            if [[ "$code" == "200" ]]; then
              echo "Production verification passed: HTTP 200"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 10
          done
          echo "::error::Production endpoint did not return HTTP 200"
          exit 1
