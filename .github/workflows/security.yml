name: Security scanning
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
  security-events: write
jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@6e7b7d1ac3245eba8d3ebb337c6feb0dfe921fc8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@6d857a5973188e9fdeef6d5fc12c456b09f04ff5
        with:
          sarif_file: 'trivy-results.sarif'
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$(pwd):/repo" truffle/trufflehog:latest filesystem /repo --json || true
