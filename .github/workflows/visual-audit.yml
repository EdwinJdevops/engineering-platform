name: Visual browser audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'layouts/**'
      - 'static/**'
      - 'content/**'
      - 'scripts/visual_audit.cjs'
      - 'scripts/hashnode_article_audit.cjs'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
      - name: Build site
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache -v "$PWD:/src" -w /src \
            ghcr.io/gohugoio/hugo:v0.164.0@sha256:630fef353bd10c5a23f909002d18dcdc031682375632a38d4fcfd20ad1e5441f \
            --minify --gc --baseURL "/"
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit routes and viewport sizes
        run: |
          python3 -m http.server 4173 --directory public >/tmp/site.log 2>&1 &
          node scripts/visual_audit.cjs
          node scripts/hashnode_article_audit.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-visual-audit
          path: visual-audit/
          if-no-files-found: warn
