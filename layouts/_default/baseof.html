<!doctype html>
<html lang="{{ site.Language.Locale | default "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080b10">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · Edwin Jonathan{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="author" content="Edwin Jonathan">
  <link rel="canonical" href="{{ with .Params.canonical_url }}{{ . }}{{ else }}{{ .Permalink }}{{ end }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <script src="{{ "js/scroll-reveal.js" | relURL }}" defer></script>
  <script src="{{ "js/editorial-covers.js" | relURL }}" defer></script>
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ site.Title }}">
  <meta property="og:site_name" content="Edwin Jonathan Engineering Platform">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ $socialImage := "https://edwinjdevops.github.io/engineering-platform/images/edwin-portrait-web.webp" }}
  <meta property="og:image" content="{{ $socialImage }}">
  <meta property="og:image:secure_url" content="{{ $socialImage }}">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="720">
  <meta property="og:image:height" content="1205">
  <meta property="og:image:alt" content="Portrait of Edwin Jonathan, platform and cloud engineer">
  <meta name="twitter:image" content="{{ $socialImage }}">
  <meta name="twitter:card" content="summary">
  {{ partial "structured-data.html" . }}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
</body>
</html>
