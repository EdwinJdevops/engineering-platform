{{- $page := .page -}}
{{- $variant := .variant | default "card" -}}
{{- $url := $page.Params.cover_image | default "" -}}
{{- $alt := $page.Params.cover_alt | default (printf "Editorial illustration for %s" $page.Title) -}}
<div class="editorial-cover editorial-cover--{{ $variant }}">
  <div class="editorial-cover-graphic" aria-hidden="true">
    <span class="editorial-cover-orbit editorial-cover-orbit--one"></span>
    <span class="editorial-cover-orbit editorial-cover-orbit--two"></span>
    <span class="editorial-cover-type">EDWIN / SYSTEM NOTES</span>
    <strong>{{ $page.Title }}</strong>
  </div>
  {{ with $url }}
    <img src="{{ . | safeURL }}" alt="{{ $alt }}" loading="{{ if eq $variant "hero" }}eager{{ else }}lazy{{ end }}" decoding="async" referrerpolicy="no-referrer">
  {{ end }}
</div>
